aid: upwave
name: Upwave
description: >-
  Upwave (formerly Survata) is the Brand Outcomes Measurement Platform — it
  brings science to top-of-funnel advertising by measuring Brand Lift,
  validating Brand Reach, and surfacing optimization insights for brand
  campaigns across CTV, digital, linear TV, audio, and social channels.
  Advertisers, agencies, and media platforms use Upwave dashboards and its
  Bayes AI layer to quantify how campaigns move awareness, favorability,
  consideration, and intent. Upwave is delivered as a SaaS application with a
  managed partner ecosystem of ad servers and DSPs, and does not publish a
  public developer portal or API documentation. It is a portfolio company of
  Y Combinator, Uncork Capital, and Initialized Capital.
